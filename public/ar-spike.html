<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Obelisk AR Spike — 8th Wall World Tracking</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
  #app { position: fixed; inset: 0; }
  #overlay {
    position: fixed; left: 0; right: 0; top: 0; z-index: 20;
    padding: 12px; padding-top: max(12px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.75); color: #6ee7b7; font-size: 11px; font-family: monospace;
    line-height: 1.5; max-height: 45vh; overflow-y: auto; white-space: pre-wrap;
    transition: opacity 0.2s;
  }
  #overlay.collapsed {
    max-height: none; padding: 6px 10px; background: rgba(0,0,0,0.55);
    width: fit-content; border-radius: 0 0 10px 0;
  }
  #overlay.collapsed .full-log { display: none; }
  #overlay .full-log { display: block; white-space: pre-wrap; }
  #overlay .status-line { display: none; font-weight: 700; }
  #overlay.collapsed .status-line { display: block; }
  #start {
    position: fixed; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 20; padding: 16px; border-radius: 14px; border: none;
    background: #10b981; color: #04342c; font-weight: 700; font-size: 16px;
  }
  #instructions {
    position: fixed; left: 20px; right: 20px; bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px));
    z-index: 20; padding: 10px 14px; border-radius: 12px; background: rgba(0,0,0,0.7);
    color: #fff; font-size: 12px; text-align: center; display: none;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <canvas id="camerafeed" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;"></canvas>
  <div id="overlay" onclick="document.getElementById('overlay').classList.toggle('collapsed')">
    <span class="status-line">Loading engine…</span>
    <span class="full-log"></span>
  </div>
  <div id="instructions">Look up — the model sits ~10ft overhead, 3m ahead. Walk under it, walk away and look back, and rotate the phone. It should hold its spot.</div>
  <button id="start">Start camera</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script>
    const log = (msg) => {
      const full = document.querySelector('#overlay .full-log');
      const status = document.querySelector('#overlay .status-line');
      const stamp = new Date().toISOString().slice(11, 19);
      full.textContent += `\n[${stamp}] ${msg}`;
      status.textContent = msg;
      const scrollHost = document.getElementById('overlay');
      scrollHost.scrollTop = scrollHost.scrollHeight;
      console.log(msg);
    };
    const collapseOverlay = () => document.getElementById('overlay').classList.add('collapsed');
    const sizeCanvas = (canvas) => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    };
    window.addEventListener('error', (e) => log(`WINDOW ERROR: ${e.message}`));
    log('three.js loaded: ' + (typeof THREE !== 'undefined'));
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async
    crossorigin="anonymous"
    data-preload-chunks="slam"
  ></script>

  <script>
    let started = false;
    let lastDiagAt = 0;

    const appPipelineModule = () => ({
      name: 'obelisk-ar-spike',
      onStart: ({ canvas }) => {
        log('onStart fired — building scene');
        try {
          const { scene, camera } = XR8.Threejs.xrScene();

          scene.add(new THREE.HemisphereLight(0xffffff, 0x1f2937, 2.4));
          const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
          keyLight.position.set(2, 4, 3);
          scene.add(keyLight);
          const fillLight = new THREE.DirectionalLight(0x80bfff, 0.8);
          fillLight.position.set(-3, 1, -2);
          scene.add(fillLight);

          // Placeholder box, visible immediately while the real GLB loads (and
          // stays as a fallback if it fails) — same world-locked spot the real
          // model will occupy: ~10ft (3m) up, 3m ahead of the camera's start
          // pose. If World Tracking works, this position holds regardless of
          // how far the viewer walks or turns — the test for genuine parallax.
          const TARGET_POSITION = [0, 3, -3];
          const box = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x10b981 }),
          );
          box.position.set(...TARGET_POSITION);
          scene.add(box);
          camera.position.set(0, 0, 0);
          log('Placeholder box at (0,3,-3) — ~10ft up, 3m ahead. Loading GLB…');
          collapseOverlay();

          const dracoLoader = new THREE.DRACOLoader();
          dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
          const gltfLoader = new THREE.GLTFLoader();
          gltfLoader.setDRACOLoader(dracoLoader);
          gltfLoader.load(
            '/ar-test-model.glb',
            (gltf) => {
              const model = gltf.scene;
              const bounds = new THREE.Box3().setFromObject(model);
              const center = bounds.getCenter(new THREE.Vector3());
              const size = bounds.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z, 0.001);
              model.position.sub(center);
              const pivot = new THREE.Group();
              pivot.add(model);
              // Normalize to 1 unit, then scale to a believable real-world size.
              const REAL_WORLD_SIZE_M = 2.5;
              pivot.scale.setScalar((1 / maxDim) * REAL_WORLD_SIZE_M);
              pivot.position.set(...TARGET_POSITION);
              scene.add(pivot);
              scene.remove(box);
              log(`GLB loaded OK — raw size ${size.x.toFixed(2)}x${size.y.toFixed(2)}x${size.z.toFixed(2)}m, scaled to ${REAL_WORLD_SIZE_M}m`);
            },
            (progress) => {
              if (progress.total) log(`GLB loading: ${Math.round((progress.loaded / progress.total) * 100)}%`);
            },
            (err) => {
              log('GLB LOAD ERROR (keeping placeholder box): ' + (err && err.message ? err.message : err));
            },
          );

          // Diagnostic: confirm the camera video is actually reaching the
          // engine, and surface whatever tracking-status fields exist. A flat
          // black background with no visible video means we may only be
          // getting gyro/compass rotation, not real camera-based SLAM.
          const video = document.querySelector('video');
          log('video element: ' + (video
            ? `readyState=${video.readyState} size=${video.videoWidth}x${video.videoHeight}`
            : 'NONE FOUND'));
        } catch (err) {
          log('onStart ERROR: ' + (err && err.message ? err.message : err));
        }
      },
      onUpdate: ({ processCpuResult }) => {
        const now = performance.now();
        if (now - lastDiagAt < 2000) return;
        lastDiagAt = now;
        try {
          const video = document.querySelector('video');
          const videoInfo = video ? `video ${video.readyState}/${video.videoWidth}x${video.videoHeight}` : 'no video el';
          const reality = processCpuResult && processCpuResult.reality;
          const realityInfo = reality
            ? JSON.stringify(reality, (k, v) => (Array.isArray(v) && v.length > 6 ? '[array]' : v)).slice(0, 200)
            : 'no reality data';
          log(`diag: ${videoInfo} | ${realityInfo}`);
        } catch (err) {
          log('diag ERROR: ' + (err && err.message ? err.message : err));
        }
      },
      onException: (err) => log('PIPELINE EXCEPTION: ' + (err && err.message ? err.message : JSON.stringify(err))),
    });

    const initXr8 = () => {
      log('XR8 available — configuring');
      try {
        XR8.XrController.configure({ disableWorldTracking: false });
        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),
          XR8.Threejs.pipelineModule(),
          XR8.XrController.pipelineModule(),
          appPipelineModule(),
        ]);
        log('Pipeline modules registered. Waiting for Start tap.');
      } catch (err) {
        log('CONFIGURE ERROR: ' + (err && err.message ? err.message : err));
      }
    };

    const waitForXr8 = () => {
      if (window.XR8) { initXr8(); return; }
      log('Waiting for xrloaded event…');
      window.addEventListener('xrloaded', () => { log('xrloaded event fired'); initXr8(); });
      setTimeout(() => {
        if (!window.XR8) log('WARNING: 15s elapsed, XR8 still not on window. Engine script may have failed to load.');
      }, 15000);
    };

    window.addEventListener('load', waitForXr8);

    document.getElementById('start').addEventListener('click', () => {
      if (started) return;
      if (!window.XR8) { log('Cannot start — XR8 not loaded yet.'); return; }
      started = true;
      document.getElementById('start').style.display = 'none';
      document.getElementById('instructions').style.display = 'block';
      try {
        const canvas = document.getElementById('camerafeed');
        sizeCanvas(canvas);
        window.addEventListener('resize', () => sizeCanvas(canvas));
        log('Calling XR8.run() with canvas ' + canvas.width + 'x' + canvas.height);
        XR8.run({ canvas });
      } catch (err) {
        log('XR8.run ERROR: ' + (err && err.message ? err.message : err));
      }
    });
  </script>
</body>
</html>
