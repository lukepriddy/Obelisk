<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AR field-of-view comparison</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:-apple-system, sans-serif; color:#fff; }
  .layer { position:fixed; inset:0; }
  video, canvas { width:100%; height:100%; display:block; }
  #readout {
    position:fixed; left:0; right:0; top:0; z-index:30; padding:10px 12px;
    padding-top:max(10px, env(safe-area-inset-top));
    background:rgba(0,0,0,.78); color:#6ee7b7; font:11px/1.5 ui-monospace, monospace;
    white-space:pre-wrap;
  }
  #controls {
    position:fixed; left:12px; right:12px; bottom:max(14px, env(safe-area-inset-bottom));
    z-index:30; display:flex; gap:8px; flex-wrap:wrap;
  }
  button {
    flex:1 1 45%; padding:13px 10px; border:0; border-radius:12px;
    background:#27272a; color:#fff; font-weight:700; font-size:13px;
  }
  button.on { background:#10b981; color:#04342c; }
  #hint {
    position:fixed; left:12px; right:12px; bottom:max(76px, calc(env(safe-area-inset-bottom) + 62px));
    z-index:30; text-align:center; font-size:12px; color:#d4d4d8;
    background:rgba(0,0,0,.6); padding:8px 10px; border-radius:10px;
  }
</style>
</head>
<body>
  <!-- Raw getUserMedia feed. object-fit is switched between contain (the
       sensor's true field of view, letterboxed) and cover (what filling a tall
       screen actually shows) so the crop can be seen directly. -->
  <video id="raw" class="layer" playsinline muted autoplay style="object-fit:contain; background:#000;"></video>
  <canvas id="arcanvas" class="layer" style="display:none;"></canvas>

  <div id="readout">measuring…</div>
  <div id="hint">Hold the phone still and compare each mode against what your eyes see.</div>
  <div id="controls">
    <button id="b-contain" class="on">Raw · full sensor</button>
    <button id="b-cover">Raw · screen-filled</button>
    <button id="b-ar">AR · screen-filled</button>
    <button id="b-arwide">AR · letterboxed</button>
    <button id="b-stop">Stop</button>
  </div>

  <!-- three.js dropped the UMD build/three.min.js bundle around r160, so a
       modern version 404s here and leaves window.THREE undefined — which the
       engine's ThreeJS module needs. 0.128 still ships it. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script>
    const out = document.getElementById('readout');
    const video = document.getElementById('raw');
    const canvas = document.getElementById('arcanvas');
    const lines = {};
    const show = () => { out.textContent = Object.values(lines).join('\n'); };
    const set = (k, v) => { lines[k] = v; show(); };

    const screenAspect = (window.innerWidth / window.innerHeight);
    set('screen', `screen      ${window.innerWidth}x${window.innerHeight}  aspect ${screenAspect.toFixed(3)}  dpr ${window.devicePixelRatio}`);

    let stream = null;

    async function startRaw() {
      try {
        // No dimension constraints. Asking for a specific size makes iOS crop
        // the sensor to match that aspect before handing the stream over —
        // an earlier version of this page requested 4096x2160 and lost 29% of
        // the width to its own constraint, then measured the result as if the
        // camera had done it.
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play().catch(() => {});

        const track = stream.getVideoTracks()[0];
        const s = track.getSettings();
        const camAspect = s.width && s.height ? (s.width / s.height) : 0;
        set('cam', `camera      ${s.width}x${s.height}  aspect ${camAspect.toFixed(3)}`);

        // How much width survives when this feed is stretched to fill a screen
        // this tall. Below 1.0 means horizontal field of view is being thrown
        // away — that is the "why does it look zoomed in" number.
        const portraitCam = 1 / camAspect;               // camera aspect as displayed upright
        const visibleWidth = Math.min(1, portraitCam / screenAspect);
        set('crop', `fill crop   ${(visibleWidth * 100).toFixed(0)}% of width visible when screen-filled`);

        const caps = track.getCapabilities ? track.getCapabilities() : null;
        if (caps) {
          set('caps', `max offered ${caps.width?.max || '?'}x${caps.height?.max || '?'}` +
                      (caps.zoom ? `  zoom ${caps.zoom.min}-${caps.zoom.max}` : '  zoom n/a'));
        }
        set('devices', 'cameras     counting…');
        const all = await navigator.mediaDevices.enumerateDevices();
        const cams = all.filter(d => d.kind === 'videoinput');
        set('devices', `cameras     ${cams.length} available` +
          (cams.some(c => /ultra|wide/i.test(c.label)) ? ' (an ultra-wide is listed)' : ''));
      } catch (err) {
        set('cam', 'camera      FAILED: ' + (err && err.message ? err.message : err));
      }
    }

    function stopRaw() {
      stream?.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
    }

    // ── mode switching ──
    const buttons = {
      contain: document.getElementById('b-contain'),
      cover:   document.getElementById('b-cover'),
      ar:      document.getElementById('b-ar'),
      arwide:  document.getElementById('b-arwide'),
    };
    const highlight = (key) => {
      Object.entries(buttons).forEach(([k, el]) => el.classList.toggle('on', k === key));
    };

    document.getElementById('b-contain').onclick = () => {
      stopAr(); video.style.display = 'block'; canvas.style.display = 'none';
      video.style.objectFit = 'contain';
      if (!stream) startRaw();
      highlight('contain');
    };
    document.getElementById('b-cover').onclick = () => {
      stopAr(); video.style.display = 'block'; canvas.style.display = 'none';
      video.style.objectFit = 'cover';
      if (!stream) startRaw();
      highlight('cover');
    };
    document.getElementById('b-stop').onclick = () => { stopAr(); stopRaw(); };

    // ── AR engine mode ──
    let arRunning = false;
    let frames = 0;
    function stopAr() {
      if (!arRunning) return;
      arRunning = false;
      try { window.XR8.stop(); } catch (e) {}
      try { window.XR8.clearCameraPipelineModules(); } catch (e) {}
      canvas.style.display = 'none';
    }

    const startAr = async (letterbox) => {
      stopRaw();
      stopAr();
      video.style.display = 'none';
      canvas.style.display = 'block';
      highlight(letterbox ? 'arwide' : 'ar');

      // Screen-filled: canvas matches the screen, so the 3:4 feed loses its
      // sides. Letterboxed: canvas matches the feed's own 3:4 shape, centred
      // with black above and below, so the full sensor width survives.
      if (letterbox) {
        Object.assign(canvas.style, {
          inset: 'auto', top: '50%', left: '0', right: '0',
          transform: 'translateY(-50%)', height: 'auto', aspectRatio: '3 / 4',
        });
      } else {
        Object.assign(canvas.style, {
          inset: '0', top: '', left: '', right: '',
          transform: '', height: '100%', aspectRatio: '',
        });
      }

      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === 'function') {
        try { await DOE.requestPermission(); } catch (e) {}
      }
      if (!window.XR8) { set('ar', 'ar          engine not loaded yet, tap again'); return; }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      // The backing store must match the displayed shape, or the engine
      // computes its aspect from the wrong numbers and the letterbox gains
      // nothing.
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round((letterbox ? window.innerWidth * (4 / 3) : window.innerHeight) * dpr);

      window.XR8.XrController.configure({ disableWorldTracking: false });
      window.XR8.addCameraPipelineModules([
        window.XR8.GlTextureRenderer.pipelineModule(),
        window.XR8.Threejs.pipelineModule(),
        window.XR8.XrController.pipelineModule(),
        {
          name: 'fov-probe',
          onStart: () => set('ar', 'ar engine   started, sampling…'),
          // Sampled per frame, not at onStart. The engine may overwrite the
          // three.js camera's FOV from real intrinsics once frames flow, so
          // reading it before that captures a default instead of the truth.
          onUpdate: ({ processCpuResult }) => {
            frames++;
            const { camera } = window.XR8.Threejs.xrScene();
            const vfov = camera.fov;
            const hfov = 2 * Math.atan(Math.tan((vfov * Math.PI / 180) / 2) * camera.aspect) * 180 / Math.PI;
            set('ar', `ar engine   V ${vfov.toFixed(1)}deg  H ${hfov.toFixed(1)}deg  aspect ${camera.aspect.toFixed(3)}  frame ${frames}`);

            const r = processCpuResult?.reality;
            if (r?.intrinsics && !lines.intr) {
              const i = r.intrinsics;
              // Real intrinsics let us compute the camera's ACTUAL field of
              // view, independent of whatever the renderer decided to use.
              const arr = Array.isArray(i) ? i : (i.data || null);
              set('intr', arr
                ? `intrinsics  [${arr.slice(0, 6).map(n => (+n).toFixed(1)).join(', ')}…]`
                : `intrinsics  present (${Object.keys(i).join(',')})`);
            }
            // The source video tells us the true sensor framing the engine got.
            if (!lines.feed) {
              const v = document.querySelector('video:not(#raw)') || document.querySelector('video');
              if (v && v.videoWidth) {
                set('feed', `engine feed ${v.videoWidth}x${v.videoHeight}  aspect ${(v.videoWidth / v.videoHeight).toFixed(3)}`);
              }
            }
          },
          onException: (e) => set('ar', 'ar          EXCEPTION: ' + (e?.message || e)),
        },
      ]);
      arRunning = true;
      frames = 0;
      window.XR8.run({ canvas });
    };

    document.getElementById('b-ar').onclick = () => startAr(false);
    document.getElementById('b-arwide').onclick = () => startAr(true);

    startRaw();
  </script>
</body>
</html>
