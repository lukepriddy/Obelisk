<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Tab icon. The brand mark is lucide's MapPin, the same shape the app draws
    in the dashboard header and on the sign-in screen, so the tab matches what
    a creator sees inside the product.

    Drawn as a path rather than imported from lucide because this file is
    fetched by the browser before any JavaScript exists. The geometry is
    lucide's own 24x24 MapPin, translated and scaled to sit in a 32x32 tile.

    Colours are the app's: zinc-950 tile, emerald-400 mark.
  -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <g transform="translate(4 4) scale(1.0)"
     fill="none" stroke="#34d399" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
    <circle cx="12" cy="10" r="3"/>
  </g>
</svg>
