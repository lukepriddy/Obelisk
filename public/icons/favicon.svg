<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    Tab icon: the bare mark on transparency.

    No tile behind it, deliberately. A rounded rectangle reads as an outline
    around the pin at tab size, and the browser already draws the icon on its
    own background — one more edge is just noise.

    Geometry is lucide's MapPin verbatim, the same mark the dashboard header
    and the sign-in screen render. Filled rather than stroked: an outline loses
    its stroke at 16px, while a solid pin stays readable. The head is a second
    subpath in the same element, so fill-rule="evenodd" punches it out as a
    hole instead of painting over it — which keeps the icon transparent there
    rather than assuming a background colour.

    scripts/make-icons.py draws the PNG fallback from the same shape. Change
    one, run the other.
  -->
  <path fill="#34d399" fill-rule="evenodd"
        d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z
           M15 10a3 3 0 1 0-6 0 3 3 0 0 0 6 0Z"/>
</svg>
