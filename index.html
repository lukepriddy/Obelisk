<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover → content extends into the notch/home-indicator safe areas.

      maximum-scale=1 + user-scalable=no → the page can NEVER scale-zoom: not on
      input focus, not on double-tap, and any zoom persisted by Safari from an
      old session gets clamped back to 1:1 on load. This is a product decision:
      the only zoom in Obelisk is the map's own pinch (MapLibre camera zoom on
      its canvas — unaffected by the viewport meta).

      History: maximum-scale was once removed because it was blamed for the
      fixed header/footer drifting out of sync with viewport-fit=cover. That
      drift only manifests when Safari ATTEMPTS an auto-zoom — which can no
      longer happen: inputs are forced ≥16px (no focus zoom) and
      touch-action: manipulation kills double-tap zoom. With the triggers gone,
      keeping the hard clamp is safe. Do not remove it again.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Obelisk</title>

    <!-- ── PWA: theme + manifest ──────────────────────────────────────────── -->
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── iOS Add to Home Screen ────────────────────────────────────────── -->
    <!-- Hides the browser chrome when launched from the home screen icon     -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent lets your bg color show behind the status bar      -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obelisk" />
    <!-- 180×180 PNG — add public/icons/apple-touch-icon.png to enable       -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Tailwind is now compiled at build time (see tailwind.config.js) —
         no CDN script, no unstyled first-paint flash. -->

    <style>
      /* ── Prevent iOS/Android overscroll bounce revealing the white page
         underneath. Setting background on both html and body ensures no
         flash of white in any direction. ─────────────────────────────── */
      html, body {
        overscroll-behavior: none;
        background-color: #09090b; /* zinc-950 */
      }

      /* ── Kill the grey tap-flash on every touchable element. Without this
         buttons, links, and map tiles all flash grey on tap on iOS. ───── */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Prevent iOS Safari from auto-zooming the page when the user taps
         into a text input with font-size below 16px. The @supports guard
         targets iOS Safari specifically (-webkit-touch-callout is iOS-only)
         so desktop font sizes are completely unaffected. ─────────────── */
      @supports (-webkit-touch-callout: none) {
        input,
        textarea,
        select {
          font-size: max(16px, 1em) !important;
        }
      }

      /* ── Kill iOS Safari's native double-tap ("smart") zoom. This was the
         last remaining way the whole page could get scale-zoomed: inputs are
         ≥16px (no focus zoom) and pinch is cancelled by the gesture handler,
         but a quick double tap near any control still zoomed the page — and
         Safari persists that zoom across reloads. `manipulation` disables only
         double-tap zoom; scrolling/panning is untouched.
         NOTE: touch-action does NOT inherit — the browser evaluates it on the
         element actually touched — so this must be `*`, not html/body. The
         MapLibre canvas is unaffected: its own class + inline touch-action
         rules beat the zero-specificity `*` selector, so map pan/pinch/rotate
         keep working. ──────────────────────────────────────────────────── */
      * {
        touch-action: manipulation;
      }

      /* ── Edge-bleed for full-screen overlays (sheets, modals, welcome, chat).
         With the zoom-clamp viewport meta (maximum-scale=1 + user-scalable=no +
         viewport-fit=cover), iOS Safari's visible screen edge and the layout
         box can disagree by a couple of px on the right — every full-bleed
         dark surface then shows a hairline of the map beside it. Same cure
         that fixed the top/bottom bars: overhang the surface past both edges
         so the mismatch has nothing to expose. Elements using this class must
         be position:fixed — an absolute overhang gets clipped by the app
         shell's overflow-hidden. !important because the built Tailwind CSS
         (inset-0) loads after this inline block. Phone-width only; desktop
         doesn't have the mismatch and chat's md: popup layout must win. ── */
      @media (max-width: 767px) {
        .overlay-edge-bleed {
          /* Overhang each full-bleed surface past both screen edges so the iOS
             visible-edge-vs-layout-box mismatch (and post-keyboard paint drift)
             has nothing to expose. 16px headroom; sheets have 24px corner radii
             and 24px content padding, so the lost strip is invisible. */
          left: -16px !important;
          right: -16px !important;
        }

        /* Bottom sheets keep their body flush with the visible screen edges,
           while this clip reveals real rounded corners only at the top. The
           sheet itself is still oversized beneath the clip, so there is no
           map seam down either side. */
        .player-sheet-edge {
          clip-path: inset(0 16px 0 16px round 24px 24px 0 0);
        }

        /* The locked sheet carries a visible amber outline, so give it a little
           extra paint headroom and draw its top cap inside the same clipped box.
           This prevents a right-edge map leak while the amber line follows both
           rounded corners at the same 1px weight as the focused passphrase field. */
        .locked-overlay-edge-bleed {
          left: -20px !important;
          right: -20px !important;
        }
        .locked-sheet-edge {
          position: relative;
          clip-path: inset(0 20px 0 20px round 24px 24px 0 0);
        }
        .locked-sheet-edge::before {
          content: '';
          position: absolute;
          z-index: 1;
          pointer-events: none;
          top: 0;
          left: 20px;
          right: 20px;
          height: 25px;
          border: 1px solid #f59e0b;
          border-bottom: 0;
          border-radius: 24px 24px 0 0;
        }
      }

      /* ── Hide all scrollbars (scroll still works, bar just invisible) ── */
      ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
      * { scrollbar-width: none; }

      /* ── Landscape lock — show rotate prompt on small screens in landscape ── */
      /* max-height:500px excludes desktop windows that happen to be wider than tall */
      #landscape-lock {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #09090b;
        color: #ffffff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        padding: 32px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #landscape-lock { display: flex; }
      }
    </style>
  </head>

  <!--
    No bg-white class — body bg is set in CSS above so the overscroll area
    always matches the app background, not the browser default white.
  -->
  <body class="h-full">
    <!-- Landscape lock overlay — shown via CSS media query, no JS needed -->
    <div id="landscape-lock">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <path d="M12 18h.01"/>
      </svg>
      <p style="font-size:1rem;font-weight:600;margin:0">Please rotate your device</p>
      <p style="font-size:0.85rem;opacity:0.5;margin:0">Obelisk works best in portrait mode</p>
    </div>

    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- ── Block page-level pinch zoom ──────────────────────────────────────
         Prevent iOS Safari's page-zoom gesture so a stray pinch can't zoom the
         whole player chrome. This only cancels the pinch GESTURE — it doesn't
         touch the viewport meta or layout, so header/footer/welcome stay put.
         The MapLibre map zooms via its own touch handling on the canvas and is
         unaffected. -->
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>

    <!-- ── Backstop: reset a stuck page zoom ─────────────────────────────────
         The viewport meta's maximum-scale=1 should make page zoom impossible
         and clamp any zoom Safari persisted from old builds. This watchdog is
         the backstop for the rare paths where Safari overrides the clamp
         (e.g. accessibility pinch): if the visual viewport ever reports
         scale > 1, rewriting the meta content forces Safari to re-apply the
         clamp and snap back to 1:1. -->
    <script>
      (function () {
        var vv = window.visualViewport;
        var meta = document.querySelector('meta[name="viewport"]');
        if (!vv || !meta) return;
        var BASE = meta.getAttribute('content');
        var resetting = false;
        function keyboardOpen() {
          var ae = document.activeElement;
          return !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
        }
        function heal() {
          if (resetting) return;
          resetting = true;
          window.scrollTo(0, 0);
          meta.setAttribute('content', BASE + ', maximum-scale=1');
          setTimeout(function () {
            meta.setAttribute('content', BASE);
            resetting = false;
          }, 250);
        }
        function resync() {
          // While an input is focused, Safari legitimately pans/resizes the
          // visual viewport to reveal the field — never fight that.
          if (keyboardOpen()) return;
          // Desync = any disagreement between visual and layout viewports:
          //  - scale drift (pinch/accessibility zoom that beat the clamp)
          //  - width mismatch or horizontal offset at ~1x.
          var desynced =
            vv.scale > 1.02 ||
            Math.abs(vv.width - window.innerWidth) > 1 ||
            Math.abs(vv.offsetLeft) > 1;
          if (desynced) heal();
        }
        window.addEventListener('pageshow', resync);
        var t;
        var lastHeight = vv.height;
        vv.addEventListener('resize', function () {
          var grew = vv.height - lastHeight;
          lastHeight = vv.height;
          clearTimeout(t);
          // Viewport got much taller = the keyboard just closed. This is the
          // one path where iOS can leave fixed elements PAINTED offset while
          // every JS metric reads in-sync — heal unconditionally instead of
          // trusting the desync checks.
          if (grew > 100 && !keyboardOpen()) { t = setTimeout(heal, 250); return; }
          t = setTimeout(resync, 300);
        });
        vv.addEventListener('scroll', function () {
          clearTimeout(t);
          t = setTimeout(resync, 300);
        });
        // Keyboard dismissal: focus leaves the input slightly before the
        // viewport settles — heal shortly after, unconditionally.
        document.addEventListener('focusout', function () {
          setTimeout(function () { if (!keyboardOpen()) heal(); }, 450);
        });
        resync();
      })();
    </script>

    <!-- ── Register service worker (enables Chrome install prompt + offline) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // SW registration failure is non-fatal — app still works fully
          });
        });
      }
    </script>
  </body>
</html>
