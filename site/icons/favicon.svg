<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    Tab icon: the mark on transparency, no tile.

    Transparent on purpose. A favicon is drawn on whatever the browser paints
    behind it — a dark toolbar, a light one, a bookmark bar, a light-mode tab —
    so baking in a background makes it wrong on half of them. A black square
    behind a green pin looks deliberate on a dark tab and like a sticker on a
    white one.

    The white-border problem from an earlier attempt was a different thing: a
    ROUNDED tile whose transparent corners let the browser's contrast chip show
    through. There is no tile here, so there is nothing to show around.

    Geometry is lucide's MapPin, matching components/BrandMark.tsx and the
    supplied logo. #07b981 is sampled from that file.
    scripts/make-icons.py renders the PNG fallbacks from the same source.
  -->
  <g fill="none" stroke="#07b981" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
    <circle cx="12" cy="10" r="3"/>
  </g>
</svg>
